# Builds the chains' current prices twice a day and publishes them on GitHub Pages.
# The chains update their files overnight and in the morning (Super Vero around
# 09:00 in Serbia), so the second run catches late ones.
name: Prices

on:
  schedule:
    - cron: "30 5 * * *" # 06:30 in Serbia in winter, 07:30 in summer
    - cron: "30 11 * * *"
  # A change to the job publishes right away.
  push:
    branches: [main]
    paths: [build-prices.mjs, .github/workflows/prices.yml]
  workflow_dispatch:

permissions:
  contents: write # for the keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      # With the published address, a chain whose download fails keeps its last files.
      - run: node build-prices.mjs site "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub turns off scheduled runs in a repository with no activity for 60 days,
      # so an empty commit is made once 50 days have passed since the last one.
      - name: Keep the schedule running
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 24 * 3600 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the daily price job running"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
